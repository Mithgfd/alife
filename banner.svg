<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ALIFE — evolving foragers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d13"/>
      <stop offset="0.55" stop-color="#0e141d"/>
      <stop offset="1" stop-color="#121b26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect y="296" width="1200" height="4" fill="url(#accent)"/>

  <!-- identity -->
  <text x="76" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="4" fill="#6ee7b7">ARTIFICIAL LIFE / 001</text>
  <text x="72" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="72" font-weight="700" letter-spacing="14" fill="#f5f7fb">ALIFE</text>
  <text x="76" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="7" fill="#9aa3b2">EVOLVING FORAGERS</text>
  <text x="76" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7d8698">genomes &#8594; neural nets &#8594; food &#8594; mutation &#8594; predation</text>

  <!-- pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">
    <rect x="76" y="248" width="78" height="28" rx="14" fill="#ed225d" fill-opacity="0.10" stroke="#ed225d" stroke-opacity="0.45"/>
    <text x="115" y="266" text-anchor="middle" fill="#f08aa8">P5.JS</text>

    <rect x="164" y="248" width="116" height="28" rx="14" fill="#f7df1e" fill-opacity="0.09" stroke="#f7df1e" stroke-opacity="0.40"/>
    <text x="222" y="266" text-anchor="middle" fill="#e8d37a">VANILLA JS</text>

    <rect x="290" y="248" width="100" height="28" rx="14" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="340" y="266" text-anchor="middle" fill="#6ee7b7">NO BUILD</text>

    <rect x="400" y="248" width="88" height="28" rx="14" fill="#60a5fa" fill-opacity="0.10" stroke="#60a5fa" stroke-opacity="0.45"/>
    <text x="444" y="266" text-anchor="middle" fill="#93c5fd">OFFLINE</text>
  </g>

  <!-- population sparkline panel -->
  <rect x="690" y="62" width="440" height="176" rx="16" fill="#0b1119" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="714" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="3" fill="#5f6b7d">POPULATION</text>
  <text x="1106" y="88" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2" fill="#6ee7b7">GEN 45</text>

  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="714" y1="110" x2="1106" y2="110"/>
    <line x1="714" y1="145" x2="1106" y2="145"/>
    <line x1="714" y1="180" x2="1106" y2="180"/>
    <line x1="714" y1="215" x2="1106" y2="215"/>
  </g>

  <path d="M714 215 L714 178.3 L737.5 181.4 L761 173 L784.6 185.6 L808.1 179.3 L831.6 194 L855.1 187.7 L878.6 198.2 L902.2 189.8 L925.7 202.4 L949.2 191.9 L972.7 200.3 L996.2 187.7 L1019.8 196.1 L1043.3 183.5 L1066.8 191.9 L1090.3 179.3 L1106 187.7 L1106 215 Z" fill="url(#area)"/>
  <polyline points="714,178.3 737.5,181.4 761,173 784.6,185.6 808.1,179.3 831.6,194 855.1,187.7 878.6,198.2 902.2,189.8 925.7,202.4 949.2,191.9 972.7,200.3 996.2,187.7 1019.8,196.1 1043.3,183.5 1066.8,191.9 1090.3,179.3 1106,187.7" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <circle cx="761" cy="173" r="3.5" fill="#f472b6"/>
  <circle cx="878.6" cy="198.2" r="3.5" fill="#60a5fa"/>
  <circle cx="1043.3" cy="183.5" r="3.5" fill="#fbbf24"/>
  <circle cx="1106" cy="187.7" r="3.5" fill="#34d399"/>
</svg>
