<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIFE — evolving foragers</title>
<style>
  :root {
    --bg: #101216;
    --ink: #e7e9ee;
    --dim: #7d8493;
    --line: #232733;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 22px 16px 30px;
  }
  header {
    width: 100%;
    max-width: 1262px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  header p {
    margin: 0;
    color: var(--dim);
    font-size: 12px;
  }
  #stage { line-height: 0; }
  #stage canvas {
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  #hints {
    width: 100%;
    max-width: 1262px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    color: var(--dim);
    font-size: 12px;
  }
  #hints b {
    color: var(--ink);
    font-weight: 600;
    background: #1a1e26;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    margin-right: 2px;
  }
</style>
</head>
<body>
  <header>
    <h1>ALIFE — evolving foragers</h1>
    <p>genomes &rarr; tiny neural nets &rarr; food, mutation, predation</p>
  </header>

  <div id="stage"></div>

  <div id="hints">
    <span><b>space</b> pause</span>
    <span><b>1</b> 1&times;</span>
    <span><b>2</b> 4&times;</span>
    <span><b>3</b> 16&times;</span>
    <span><b>4</b> 64&times;</span>
    <span><b>r</b> reset</span>
    <span><b>p</b> predation on/off</span>
    <span><b>click</b> inspect a creature</span>
  </div>

  <script src="p5.min.js"></script>
  <script src="sim.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
