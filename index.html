<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIFE — evolving foragers</title>
<style>
  :root {
    --bg: #101216;
    --ink: #e7e9ee;
    --dim: #7d8493;
    --line: #232733;
    --panel: #1a1e26;
    --accent: #6ee7b7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 22px 16px 30px;
  }
  header {
    width: 100%;
    max-width: 1262px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  header p {
    margin: 0;
    color: var(--dim);
    font-size: 12px;
  }
  #toolbar {
    width: 100%;
    max-width: 1262px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  #toolbar .group {
    display: flex;
    gap: 4px;
    padding-left: 8px;
    border-left: 1px solid var(--line);
  }
  button {
    font: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  button:hover { background: #222834; }
  button.on {
    background: #16302a;
    border-color: #2f6f5e;
    color: var(--accent);
  }
  button.seed {
    margin-left: auto;
    color: var(--dim);
    background: transparent;
    border-color: transparent;
    font-size: 12px;
  }
  button.seed:hover { color: var(--ink); text-decoration: underline; }
  #stage { line-height: 0; max-width: 100%; }
  #stage canvas {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  #hints {
    width: 100%;
    max-width: 1262px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    color: var(--dim);
    font-size: 12px;
  }
  #hints b {
    color: var(--ink);
    font-weight: 600;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    margin-right: 2px;
  }
</style>
</head>
<body>
  <header>
    <h1>ALIFE — evolving foragers</h1>
    <p>genomes &rarr; tiny neural nets &rarr; food, mutation, sex, predation</p>
  </header>

  <div id="toolbar">
    <button id="btn-pause">pause</button>
    <span class="group">
      <button data-speed="1">1&times;</button>
      <button data-speed="4" class="on">4&times;</button>
      <button data-speed="16">16&times;</button>
      <button data-speed="64">64&times;</button>
    </span>
    <span class="group">
      <button id="btn-reset">reset</button>
      <button id="btn-share">share</button>
      <button id="btn-save">save</button>
      <button id="btn-load">load</button>
      <input id="file" type="file" accept="application/json" hidden>
    </span>
    <span class="group">
      <button id="btn-predation">predation: on</button>
      <button id="btn-color">colour: genes</button>
      <button id="btn-sexual">sexual: on</button>
    </span>
    <button id="seed-label" class="seed" title="copy a shareable link">seed …</button>
  </div>

  <div id="stage"></div>

  <div id="hints">
    <span><b>space</b> pause</span>
    <span><b>1</b>&ndash;<b>4</b> speed</span>
    <span><b>r</b> reset</span>
    <span><b>p</b> predation</span>
    <span><b>c</b> colour</span>
    <span><b>s</b> sexual</span>
    <span><b>d</b> save</span>
    <span><b>l</b> load</span>
    <span><b>share</b> copy a seed link</span>
    <span><b>click</b> inspect a creature</span>
  </div>

  <script src="p5.min.js"></script>
  <script src="sim.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
