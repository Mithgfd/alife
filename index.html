<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIFE — evolving foragers</title>
<style>
  :root {
    --bg: #101216;
    --ink: #e7e9ee;
    --dim: #7d8493;
    --line: #232733;
    --panel: #1a1e26;
    --accent: #6ee7b7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 22px 16px 30px;
  }
  header {
    width: 100%;
    max-width: 1252px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  header p {
    margin: 0;
    color: var(--dim);
    font-size: 12px;
  }
  #toolbar {
    width: 100%;
    max-width: 1252px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
  }
  #toolbar .group {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  #toolbar .group + .group {
    padding-left: 14px;
    border-left: 1px solid var(--line);
  }
  button {
    font: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  button:hover { background: #222834; }
  button.on {
    background: #16302a;
    border-color: #2f6f5e;
    color: var(--accent);
  }
  button.seed {
    margin-left: auto;
    color: var(--dim);
    background: transparent;
    border-color: transparent;
    font-size: 12px;
  }
  button.seed:hover { color: var(--ink); text-decoration: underline; }
  .speed-control {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--dim);
    font-size: 12px;
  }
  .speed-control label { color: var(--dim); }
  .speed-control output { color: var(--accent); min-width: 38px; }
  input[type="range"] {
    width: 140px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  #stage { line-height: 0; max-width: 100%; position: relative; }
  #btn-species-fab {
    position: absolute;
    left: 26px;
    bottom: 26px;
    z-index: 5;
    font: inherit;
    font-size: 12px;
    color: var(--ink);
    background: rgba(26, 30, 38, 0.92);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  #btn-species-fab:hover { background: #222834; }
  #btn-species-fab.on {
    background: #16302a;
    border-color: #2f6f5e;
    color: var(--accent);
  }
  #species-panel {
    display: none;
    width: 100%;
    max-width: 1252px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  #species-panel.open { display: block; }
  .species-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  #species-panel h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .sort-control {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--dim);
  }
  .sort-control select {
    font: inherit;
    font-size: 11px;
    color: var(--ink);
    background: #141820;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
  }
  #species-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 8px;
    max-height: 320px;
    overflow: auto;
  }
  .species-card {
    background: #141820;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 11px;
  }
  .species-card.alive { border-color: #2f6f5e; }
  .species-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .swatch {
    width: 10px; height: 10px; border-radius: 50%;
    flex: 0 0 auto;
  }
  .species-id { color: var(--ink); font-weight: 600; }
  .species-state { color: var(--dim); margin-left: auto; }
  .species-state.on { color: var(--accent); }
  .species-traits {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 10px;
    color: var(--dim);
  }
  .species-traits span b { color: var(--ink); font-weight: 500; }
  #stage canvas {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
</style>
</head>
<body>
  <header>
    <h1>ALIFE</h1>
    <p>evolving foragers in a toroidal world</p>
  </header>

  <div id="toolbar">
    <button id="btn-pause" title="Space">pause</button>
    <span class="group speed-control">
      <label for="speed">speed</label>
      <input id="speed" type="range" min="1" max="128" value="4" step="1" title="Simulation steps per frame">
      <output id="speed-value" for="speed">4&times;</output>
    </span>
    <span class="group">
      <button id="btn-reset" title="Reset with a fresh seed (R)">reset</button>
      <details class="more-menu" id="more-menu">
        <summary title="Save, load, and share">more</summary>
        <div class="more-items">
          <button id="btn-share">copy share link</button>
          <button id="btn-save">save JSON (D)</button>
          <button id="btn-load">load JSON (L)</button>
        </div>
      </details>
      <input id="file" type="file" accept="application/json" hidden>
    </span>
    <span class="group">
      <button id="btn-predation" title="Toggle predation (P)">predation: on</button>
      <button id="btn-color" title="Toggle colour mode (C)">colour: genes</button>
      <button id="btn-sexual" title="Toggle reproduction mode (S)">sexual: on</button>
      <button id="btn-species" title="Open species catalog">species catalog</button>
    </span>
    <button id="btn-help" title="Keyboard shortcuts">?</button>
    <button id="seed-label" class="seed" title="copy a shareable link">seed …</button>
  </div>

  <div id="help-panel" aria-hidden="true">
    <b>Shortcuts:</b> Space pause · 1-4 speed presets · R reset · P predation · C colour · S sexual · D save · L load · click a creature to inspect. Use the bottom-left <b>species</b> button for lineage history.
  </div>

  <div id="species-panel" aria-hidden="true">
    <div class="species-panel-head">
      <h2 id="species-title">Species catalog</h2>
      <label class="sort-control" for="species-sort">sort
        <select id="species-sort">
          <option value="id">id (normal)</option>
          <option value="speed">top speed</option>
          <option value="size">top size</option>
          <option value="sense">top sense</option>
        </select>
      </label>
    </div>
    <div id="species-list"></div>
  </div>

  <div id="stage">
    <button id="btn-species-fab" type="button" title="Show all species">species</button>
  </div>



  <script src="p5.min.js"></script>
  <script src="sim.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
